goal: >
  초등학생이 한국어문회(8~4급)·대한검정회(8~3급, 준5·준4·준3급 포함) 시험을 골라, 검수된 한자 DB를 근거로 한
  오늘의 한자·간격 복습, 실전형 모의고사, 한국 기준 획순 따라쓰기 채점, 한자·어휘 주제로 제한되고
  대화를 이어갈 수 있는 문해력 챗봇으로 공부하는 배포 가능한 PWA(Next.js + Python LangGraph/FastAPI,
  LLM 교체 가능·기본 Bedrock)를 만든다. 학부모는 본인인증·동의 후 자녀 프로필을 만들고 학습 계획·리포트·
  대화 열람·사용 시간 제한을 관리하며, 자녀별 사용량 한도(챗봇 하루·모의고사 주간)의 무료 플랜과
  토스페이먼츠 구독(자동 환불 판정 포함)을 갖춘다.

constraints:
  # --- 급수 체계 ---
  - "대한검정회 급수는 공식 등급 순서대로 8·7·6·준5·5·준4·4·준3·3급이다(준급도 별도 급수로 선택·학습한다). 누적 배정한자는 공식값과 같아야 한다(5급 250, 4급 600, 3급 1000자). 한국어문회 급수는 8·7Ⅱ·7·6Ⅱ·6·5Ⅱ·5·4Ⅱ·4급이다. 급수별 배정한자의 원천은 data/official_lists와 data/hanja_db(브랜치 data/hanja-sources)이며 지어내지 않는다."
  - "급수별 모의고사 형식(문항 수·유형·시간·합격선)은 기관 공고로 확인된 값만 쓴다. 공식 형식을 확보하지 못한 급수(현재 대한검정회 준5·준4·준3급)는 학습 기능만 제공하고 모의고사 시작을 막으며 '형식 준비 중'으로 안내한다."
  # --- 스택 ---
  - "AI 백엔드는 Python + LangChain + LangGraph, FastAPI로 HTTP/스트리밍 API를 제공한다."
  - "에이전트는 langchain.agents.create_agent, 다중 에이전트 조율은 langgraph_supervisor.create_supervisor를 사용한다."
  - "LLM은 어댑터 인터페이스 뒤에 두어 설정만으로 교체 가능하며, 기본 구현은 langchain_aws.ChatBedrockConverse이다."
  - "모델은 작업별 등급으로 고른다. 기본은 Haiku 4.5(fast)이고 사고가 필요한 작업만 Sonnet 4.6(reasoning)을 쓴다. 챗봇 답변·안전 분류는 fast, 모의고사 AI 문항 생성(보기·해설 JSON)은 reasoning. 기본 리전은 ap-northeast-2(global.* 프로필만 제공), us-east-1·us-west-2는 us.* 프로필을 쓴다. 모델 ID: haiku = {us|global}.anthropic.claude-haiku-4-5-20251001-v1:0, sonnet = {us|global}.anthropic.claude-sonnet-4-6."
  - "프론트엔드는 Next.js 반응형 PWA(설치 가능)이며, 주 저장소는 PostgreSQL, 결제는 토스페이먼츠 정기결제(빌링)이다."
  - "테스트: 백엔드 pytest, 프론트엔드 Vitest, 전체 흐름은 Playwright E2E. 시간 의존 로직은 주입 가능한 시계(fake clock)로 KST 경계를 테스트한다."
  - "날짜 경계는 모두 KST 기준이다: 일 단위는 자정, 주 단위는 월요일 00:00."
  # --- 콘텐츠·데이터 ---
  - "모든 한자 정보(배정 한자·훈·음·빈도)는 기관 공개 배정한자 목록과 공개 사전 데이터로 구축한 검수된 DB가 유일한 정답 근거이며, 저작권 있는 기출문제 원문은 쓰지 않는다."
  - "시험 기관별로 급수 목록, 급수별 배정 한자, 출제 형식(문항 수·유형·배점·제한 시간·합격선·쓰기 출제 여부)을 독립된 설정 데이터로 두고, 기관 간 급수를 대응시키지 않는다."
  - "AI가 생성한 문항의 정답·보기·해설의 한자 정보는 출제 전 DB와 자동 대조하고, 불일치 문항은 폐기한다."
  - "훈·음은 기관별로 분리해 (기관, 글자) 단위로 저장한다(data/hanja_db/hanja_by_body.csv: body,grade,char,hun,eum,reviewed). 같은 글자라도 기관마다 훈·음이 다를 수 있다(공통 830자 중 157자 훈 상이, 易·更·取는 음 상이). 오늘의 한자·복습·모의고사 출제와 채점·챗봇 훈·음 교정은 모두 자녀가 선택한 기관의 값을 쓴다. 기관 간 값을 섞거나 한쪽 값을 우선하지 않는다."
  - "획순·자형 데이터는 hanzi-writer(Make Me a Hanzi) 데이터를 쓴다. 한국 교육용 획순과의 대조·보정은 검증 범위에서 제외한다(사용자 결정 2026-11-05). 획순 데이터가 있는 글자는 따라쓰기 채점과 모의고사 쓰기 문항에 쓰고, 획순 데이터가 없는 글자만 따라쓰기와 쓰기 문항에서 제외한다. 나중에 한국 기준과 다른 글자를 표시해 채점에서 뺄 수 있도록 글자별 제외 플래그 자리는 둔다."
  - "획순 위치·길이 허용치는 설정값이며 라이브러리 기본값에서 시작한다."
  - "모의고사는 실전형만 제공한다(축약판 없음)."
  # --- 챗봇 ---
  - "챗봇은 한자·어휘·교과 어휘 주제에만 답한다. 주제 이탈은 정중히 거절 후 관련 한자어로 유도하고, 욕설·폭력·개인정보 입력은 차단하며 개인정보는 저장하지 않는다."
  - "챗봇 답변은 목표 급수 안 한자를 우선 쓰고 급수 밖 한자에 '상위 급수' 표시, 초등 수준 어휘 3~5문장. 훈·음이 DB와 다르면 DB 값으로 교정한다. DB에 없으면 우리말샘 오픈 API로 답하고, 거기에도 없으면 \"잘 모르겠어요\"라고 답한다."
  - "대화 이력은 LangGraph 체크포인터(langgraph-checkpoint-postgres의 PostgresSaver)로 저장하고 thread_id로 이어간다. 대화 목록 메타데이터(프로필·제목·생성/최종 시각)는 별도 테이블에 둔다."
  - "자녀 프로필당 대화는 최대 100개이며, 초과 시 최종 대화 시각이 가장 오래된 대화를 체크포인트·메타데이터까지 삭제한다. 자녀와 학부모 모두 대화를 개별 삭제할 수 있고, 삭제는 영구적이다."
  # --- 계정·개인정보 ---
  - "부모(법정대리인)가 휴대폰 본인인증으로 가입하고 동의한 뒤 자녀 프로필(닉네임+PIN)을 만든다. 아동 실명·연락처는 수집하지 않는다. 부모 이메일은 가입 시 받는다(결제 실패 알림용)."
  - "대화·학습 기록의 AI 처리에는 별도 동의를 받으며, 미동의 시 해당 자녀의 챗봇만 비활성화한다."
  - "자녀 PIN 5회 오류 시 프로필 잠금, 부모 계정에서 재설정. 계정·프로필 삭제 시 학습 기록·대화 즉시 삭제, 결제 기록은 전자상거래법에 따라 5년 분리 보관 후 삭제. 1년 미접속 계정은 30일 전 안내 후 휴면 처리(데이터 분리 보관)."
  # --- 사용량 한도(무료 플랜) ---
  - "사용량은 자녀 프로필별로 센다(보호자 계정 합산 아님). 하루 한도: 챗봇 질문(베타 기본 20), 주간 한도: 모의고사 시작(베타 기본 1). 한도 값은 코드 변경 없이 설정으로 바꾼다."
  - "실패한 챗봇 응답은 사용량에 포함하지 않는다. 모의고사는 시작 시 1회 차감하며, 같은 시험을 이어서 보거나 시간 초과 자동 제출되어도 다시 차감하지 않는다."
  - "사용량 차감은 동시 요청(두 기기)에도 한도를 넘지 않도록 원자적으로 처리한다."
  - "한도 도달 시 해당 기능만 다음 초기화까지 잠근다. 아이 화면에는 '내일 또 만나요' 류의 안내만, 구독 안내는 부모 화면과 부모 푸시로만 보낸다."
  - "무료 플랜에서도 항상 무제한: 오늘의 한자, 복습, 따라쓰기, 기본 리포트(학습 시간·오늘의 한자 완료율·복습 정답률), 안전 기능(대화 열람·사용 시간 제한·유해 입력 알림). 안전·감독 기능은 절대 유료로 막지 않는다."
  - "구독 전용: 상세 리포트(취약 한자·모의고사 점수 추이·합격 가능성·쓰기 완료 한자 수·주간 푸시 요약)와 무제한 챗봇·모의고사."
  - "운영자가 한도를 올리면 즉시, 내리면 다음 초기화부터 적용한다. 이미 쓴 사용량은 소급 적용하지 않는다."
  # --- 구독·환불 ---
  - "월간·연간 요금제(가격은 설정값), 구독 1개로 자녀 최대 3명. 해지해도 결제 기간 끝까지 유지. 자동결제 실패 시 3일 유예·매일 재시도·푸시와 이메일 알림 후 무료 전환."
  - "토스페이먼츠 결제 확인 후 1분 이내 한도 잠금 해제. 유료→무료 전환 시 해당 일·주 카운터를 0으로 초기화."
  - "7일 환불: 결제 후 7일 이내 '유료 기능 사용'이 없으면 전액 환불. 유료 기능 사용 = 무료 한도를 넘는 챗봇 질문 또는 모의고사 시작, 또는 상세 리포트 열람이며, 연결된 자녀 중 한 명이라도 해당하면 사용으로 본다. 판정 기준 한도는 그 시점 설정값을 따른다."
  - "구독 중에도 자녀별 사용량을 계속 세고 한도 초과 사용·상세 리포트 열람을 유료 사용 이벤트로 기록한다."
  - "환불 요청은 자동 판정한다. 유료 사용 기록이 없으면 토스페이먼츠로 즉시 전액 환불하고 구독을 즉시 종료하며, 있으면 거절 사유를 보여주고 부모가 운영자 검토를 요청할 수 있다. 운영자 검토용 간단한 관리자 화면을 둔다."

acceptance_criteria:
  - id: AC1
    title: "한자 데이터가 공식 목록과 일치한다"
    criterion: >
      두 기관의 지원 급수별 DB 배정 한자 집합이 기관 공개 목록 파일과 누락·초과 0으로 일치하고,
      모든 배정 한자에 해당 기관의 훈·음과 검수 완료 표시가 (기관, 글자) 단위로 있다.
      [구현 순서] 선행 기능 없음(가장 먼저 구현).
    verify: "pytest: 공개 목록 fixture와 DB 집합 비교 스크립트"
  - id: AC2
    title: "부모 가입·자녀 프로필·동의가 규칙대로 동작한다"
    criterion: >
      휴대폰 본인인증을 마쳐야 가입되고 닉네임+PIN으로 자녀 프로필을 만든다. AI 처리 미동의 자녀는
      챗봇만 비활성화되고 나머지 학습은 된다. PIN 5회 오류 시 잠기고 부모 재설정 후 풀린다.
      [구현 순서] 선행 기능 없음.
    verify: "pytest(API) + Playwright(가입·프로필 화면, 본인인증은 테스트 모드/모킹)"
  - id: AC3
    title: "데이터 삭제·보관·휴면이 규칙대로 동작한다"
    criterion: >
      계정·프로필 삭제 직후 해당 자녀의 학습 기록·대화(체크포인트 포함) 잔존 0건, 결제 기록은 분리 저장소에 남는다.
      1년 미접속 계정은 30일 전 안내가 발송되고 이후 휴면 상태로 바뀐다.
      [구현 순서] 선행: 부모 가입·자녀 프로필, 대화 이력 저장.
    verify: "pytest: DB 잔존 조회, fake clock으로 휴면 스케줄 검증"
  - id: AC4
    title: "오늘의 한자가 학습 계획대로 제시된다"
    criterion: >
      시험일까지 남은 배정 한자를 균등 분배한 하루 새 한자 수(3~15자)가 자주 쓰이는 순서로 제시되고,
      부모가 수정하면 반영된다. KST 자정에 다음 날 분량으로 바뀌며, 하루를 건너뛰면 밀린 복습은 이어서,
      새 한자는 하루 분량만 나오고 계획이 재계산된다.
      [구현 순서] 선행: 한자 데이터, 부모 가입·자녀 프로필.
    verify: "pytest: fake clock 시나리오(정상·건너뛴 날·부모 수정)"
  - id: AC5
    title: "간격 복습이 규칙대로 돌아온다"
    criterion: >
      모의고사 오답 한자와 따라쓰기에서 정답 획을 본 한자가 복습 목록에 들어가 1·3·7·14일 간격으로 출제되고(하루 상한 없음),
      서로 다른 날 3회 연속 정답이면 익힘 완료로 빠지며, 틀리면 간격이 한 단계 되돌아간다.
      [구현 순서] 선행: 오늘의 한자. 모의고사·따라쓰기는 이 복습 목록에 항목을 넣는 호출자이므로 이 기준은 모의고사·따라쓰기에 의존하지 않는다.
    verify: "pytest: fake clock 간격 시뮬레이션"
  - id: AC6
    title: "기관별 실전형 모의고사를 보고 채점받는다"
    criterion: >
      선택한 기관·급수 설정과 같은 문항 수·유형·제한 시간으로 출제되고, 실제 합격선으로 합격/불합격이 표시된다.
      앱 이탈 후 이어서 볼 수 있고 타이머는 멈추지 않으며 시간 종료 시 자동 제출된다. 결과 화면에 총점·유형별 정답률·
      틀린 문항 해설이 나오고 틀린 한자가 복습 목록에 들어간다. 훈·음 문항의 정답은 선택한 기관의 훈·음이다.
      쓰기 문항은 빈 칸 직접 쓰기로 획순 데이터 기준 채점되며 획순 데이터가 없는 글자는 쓰기 문항에 나오지 않는다.
      표본 200문항 이상 검수에서 정답·보기 오류율이 1% 미만이다.
      [구현 순서] 선행: 한자 데이터, 간격 복습, 획순 따라쓰기 채점.
    verify: "pytest(출제 구성·합격 판정·DB 대조) + Playwright(이탈·재개·자동 제출) + 표본 검수 리포트"
  - id: AC7
    title: "획순 따라쓰기를 채점한다"
    criterion: >
      획순 데이터(hanzi-writer)가 있는 글자는 획마다 순서·방향을 엄격히, 위치·길이를 허용치 안에서 판정한다.
      틀린 획은 즉시 강조되어 다시 쓰고, 같은 획 3회 오류 시 정답 획을 보여준다. 결과는 통과/재시도로만 표시되고,
      서로 다른 날 2회 통과 시 쓰기 완료가 된다. 획순 데이터가 없는 글자는 따라쓰기 대상에서 빠진다.
      [검증 제외] 획순 데이터가 한국 교육용 획순 기준과 일치하는지의 대조·검수는 이 기준의 수락 조건에서 제외한다.
      평가는 위 채점 동작(획 판정·강조·정답 획 표시·통과 기록)만 확인한다.
      [구현 순서] 선행: 한자 데이터, 간격 복습. 모의고사 쓰기 문항이 이 채점기를 재사용하므로 이 기준은 모의고사에 의존하지 않는다.
    verify: "Vitest·pytest(획 판정 로직) + Playwright(스트로크 입력 시뮬레이션). 한국 기준 참조 대조는 검증 제외"
    verify_exemption_reason: "사용자 결정(2026-11-05): 한국 기준 획순 참조 데이터 대조는 검증에서 제외한다(기계 판독 가능한 공개 한국 표준 필순 데이터 없음)."
  - id: AC8
    title: "문해력 챗봇이 정확하고 안전하게 답한다"
    criterion: >
      어휘 질문에 목표 급수 우선·초등 수준 3~5문장으로 답하며, 답변의 훈·음이 자녀가 선택한 기관의 DB 값과 일치하고(불일치 시 교정),
      DB에 없는 한자는 우리말샘 결과로, 거기에도 없으면 "잘 모르겠어요"로 답한다. 주제 이탈·유해 요청 테스트 세트
      (최소 100건, 기대 동작 라벨 포함)에서 100%가 라벨대로 거절·유도 또는 차단된다. 유해·개인정보 입력은 저장되지 않고
      학부모 열람 화면 표시와 알림이 가며, 같은 대화에서 3회 반복되면 그날 챗봇이 잠긴다.
      [구현 순서] 선행: 한자 데이터, 부모 가입·자녀 프로필(AI 동의). LLM 제공자 인터페이스는 이 기준에서 만들며, 이 기준은 사용량 한도·LLM 교체·대화 이력 기준에 의존하지 않는다(그 기준들이 이 챗봇에 덧붙인다).
    verify: "pytest: 라벨된 평가 세트 + DB 대조 검사(LLM은 fake 모델과 실제 Bedrock 각각)"
  - id: AC9
    title: "챗봇 응답 속도·오류 처리가 기준을 지킨다"
    criterion: >
      스트리밍 첫 토큰이 질문 후 3초 안에 도착한다(p95, 스테이징). 15초 초과 또는 오류 시 안내 문구와 다시 시도 버튼이 보이고,
      실패한 질문은 사용량에 포함되지 않는다.
      [구현 순서] 선행: 문해력 챗봇, 무료 플랜 사용량 한도.
    verify: "Playwright + 스테이징 부하 측정(p95)"
  - id: AC10
    title: "대화 이력을 저장하고 이어가며 보관 규칙을 지킨다"
    criterion: >
      앱을 다시 열거나 다른 기기로 로그인해도 지난 대화를 골라 이어갈 수 있고 챗봇이 앞선 맥락을 반영한다.
      101번째 대화를 만들면 가장 오래된 대화가 체크포인트까지 사라져 100개가 유지되고, 사용자가 삭제한 대화는
      목록·학부모 열람·이어가기 어디에도 나타나지 않는다(DB 잔존 0건).
      [구현 순서] 선행: 문해력 챗봇.
    verify: "pytest(PostgresSaver 통합) + Playwright(이어가기)"
  - id: AC11
    title: "부모가 사용 시간을 관리한다"
    criterion: >
      부모가 하루 총 사용 시간과 사용 가능 시간대를 설정하면, 제한 5분 전 예고 후 앱이 잠기고(모의고사 중이면 끝난 뒤),
      학부모 PIN으로 추가 시간을 줄 수 있으며, 학생의 연장 요청이 부모 푸시로 가서 승인·거절된다.
      [구현 순서] 선행: 부모 가입·자녀 프로필, 실전형 모의고사.
    verify: "pytest(fake clock) + Playwright"
  - id: AC12
    title: "학부모 리포트와 대화 열람이 제공된다"
    criterion: >
      기본 리포트(학습 시간·완료율·복습 정답률)와 대화 열람은 모든 부모가, 상세 리포트(취약 한자·모의고사 추이·합격 가능성·
      쓰기 완료 수)와 주 1회 PWA 푸시 요약은 구독자만 볼 수 있다.
      [구현 순서] 선행: 오늘의 한자, 간격 복습, 실전형 모의고사, 획순 따라쓰기, 대화 이력, 구독 결제(구독자 판별).
    verify: "pytest(권한) + Playwright"
  - id: AC13
    title: "무료 플랜 사용량 한도가 자녀별로 정확히 동작한다"
    criterion: >
      무료 자녀 프로필은 설정 한도(베타 20회/일)까지 챗봇 질문을 하고 이후 KST 자정까지 챗봇만 잠긴다. 모의고사는 설정 한도
      (베타 1회/주)만큼 시작할 수 있고 재개·자동 제출은 차감되지 않으며 월요일 00:00 KST까지 시작이 잠긴다. 형제 프로필은 따로 세며,
      두 기기 동시 요청에도 한도를 넘지 않는다. 잠긴 동안 오늘의 한자·복습·따라쓰기·기본 리포트·안전 기능은 그대로 쓸 수 있다.
      아이 화면엔 '내일 또 만나요' 류 안내만, 구독 안내는 부모 화면·푸시에만 나온다. 한도를 올리면 즉시, 내리면 다음 초기화부터 적용된다.
      [구현 순서] 선행: 부모 가입·자녀 프로필, 실전형 모의고사, 문해력 챗봇. 유료 여부는 구독 상태 조회 인터페이스(기본값 무료)로 받으므로 이 기준은 구독 결제 기준에 의존하지 않는다.
    verify: "pytest(fake clock, 동시성 테스트, 설정 변경) + Playwright(아이/부모 화면 문구)"
  - id: AC14
    title: "구독 결제와 상태 전환이 동작한다"
    criterion: >
      월간·연간 요금제가 설정 가격으로 표시되고 토스페이먼츠 테스트 모드로 결제된다. 결제 확인 후 1분 이내 잠금이 풀리고,
      구독 1개로 자녀 3명이 유료 기능을 쓴다. 해지해도 기간 끝까지 유지되며, 자동결제 실패 시 3일 유예·매일 재시도·푸시와 이메일
      알림 후 무료로 전환된다. 유료→무료 전환 시 해당 일·주 카운터가 0이 된다.
      [검증 제외] 결제 기능은 위 내용대로 구현만 한다. 실제 토스페이먼츠(테스트 모드 포함) 결제·웹훅 동작 검증은
      이 기준의 수락 조건에서 제외하며, 평가는 해당 기능의 코드 구현이 존재하는지만 확인한다.
      [구현 순서] 선행: 무료 플랜 사용량 한도.
    verify: "검증 제외(구현만): 결제 기능 코드 구현 존재 여부만 확인"
    verify_exemption_reason: "사용자 결정(2026-11-05): 결제 기능은 구현만 하고 검증은 제외한다."
  - id: AC15
    title: "7일 환불이 자동 판정되고 이의 제기 경로가 있다"
    criterion: >
      결제 후 7일 이내 연결된 자녀 누구도 무료 한도 초과 사용이나 상세 리포트 열람을 하지 않았다면 환불 요청 즉시 토스페이먼츠로
      전액 환불되고 구독이 종료된다. 한 명이라도 했다면 거절 사유가 표시되고, 부모가 운영자 검토를 요청하면 관리자 화면에서
      사용 기록을 보고 승인·거절할 수 있다.
      [검증 제외] 환불은 결제 기능에 속하므로 위 내용대로 구현만 한다. 토스페이먼츠 환불(취소) 호출과 환불 흐름의 동작 검증은
      이 기준의 수락 조건에서 제외하며, 평가는 해당 기능의 코드 구현이 존재하는지만 확인한다.
      [구현 순서] 선행: 구독 결제, 무료 플랜 사용량 한도, 학부모 리포트.
    verify: "검증 제외(구현만): 환불 판정·관리자 검토 코드 구현 존재 여부만 확인"
    verify_exemption_reason: "사용자 결정(2026-11-05): 결제 기능(환불 포함)은 구현만 하고 검증은 제외한다."
  - id: AC16
    title: "LLM 제공자를 설정만으로 교체할 수 있다"
    criterion: "기본 Bedrock과 대체 제공자 1개(또는 fake 모델) 설정 모두에서 코드 수정 없이 챗봇·문제 생성 테스트가 통과한다. [구현 순서] 선행: 문해력 챗봇, 실전형 모의고사(문제 생성)."
    verify: "pytest 매트릭스(LLM_PROVIDER 설정별)"
  - id: AC17
    title: "가입부터 리포트까지 전체 흐름이 배포 환경에서 통과하고 PWA로 설치된다"
    criterion: >
      스테이징에서 Playwright E2E(가입·동의 → 자녀 프로필 → 오늘의 한자 → 따라쓰기 → 모의고사 → 챗봇 → 리포트)가 통과하고,
      manifest·service worker 검사를 통과해 설치 가능하다. 구독 결제·환불 단계는 검증 제외 대상이라 이 E2E에 포함하지 않는다.
      [구현 순서] 선행: 나머지 모든 기준(가장 마지막에 구현).
    verify: "Playwright E2E(스테이징) + Lighthouse PWA 검사"

assumptions:
  - "목표 기관·급수와 시험일은 부모가 학습계획에서 입력한다. 시험일 미입력 시 해당 급수 전체를 90일에 균등 분배한다."
  - "'자주 쓰이는 순서'의 빈도 정보는 검수된 한자 DB에 포함한다."
  - "합격 가능성은 최근 모의고사 3회 점수 평균과 합격선의 차이로 산출한다(상세 리포트 전용)."
  - "유해·개인정보 탐지는 규칙(정규식: 전화번호·주소 패턴, 욕설 사전) + LLM 분류를 함께 쓰며, '3회 반복'은 유형과 관계없이 같은 대화에서 누적한다."
  - "휴면 계정은 휴면 후 1년이 지나면 최종 삭제하고, 로그인 시 본인인증으로 복귀한다."
  - "웹 푸시를 받을 수 없는 부모에게는 이메일로 대체 알림을 보낸다."
  - "따라쓰기는 모든 획을 결국 올바르게 쓰면 통과이며, 정답 획을 본 경우 그 시도는 '재시도'로 기록한다."
  - "'1분 이내'는 백엔드가 토스페이먼츠 결제 확인을 받은 시점부터 잰다."
  - "아이 화면 안내 문구의 정확한 표현은 고정하지 않는다(주간 잠금은 주간 초기화에 맞는 문구 가능)."

ontology_schema:
  name: HanjaTutor
  description: "초등 한자 급수 학습·문해력 챗봇 PWA의 도메인 모델"
  fields:
    - {name: ExamBody, type: entity, description: "시험 기관(한국어문회, 대한검정회). 급수 목록과 출제 형식 설정을 가진다."}
    - {name: Grade, type: entity, description: "기관별 급수. 누적 배정 한자 집합과 ExamFormat을 가진다."}
    - {name: ExamFormat, type: value, description: "문항 수, 유형 구성, 배점, 제한 시간, 합격선, 쓰기 출제 여부."}
    - {name: Hanja, type: entity, description: "글자, 부수, 획수, 빈도, 기관·급수 배정(다대다). 훈·음은 HanjaReading에 기관별로 둔다."}
    - {name: HanjaReading, type: entity, description: "(기관, 글자) 단위 훈·음과 검수 상태. 기관마다 값이 다를 수 있다."}
    - {name: StrokeData, type: value, description: "hanzi-writer 기반 획순·자형 데이터와 글자별 채점 제외 플래그(한국 기준 대조는 검증 제외)."}
    - {name: Vocabulary, type: entity, description: "한자어 어휘와 구성 한자, 뜻풀이."}
    - {name: Question, type: entity, description: "AI 생성 문항. 유형, 보기, 정답, 해설, DB 대조 결과."}
    - {name: MockExam, type: entity, description: "기관·급수 형식의 시험 세션. 시작 시각(차감 시점), 이어보기 상태, 자동 제출, 점수, 합격 여부."}
    - {name: ParentAccount, type: entity, description: "법정대리인 계정. 본인인증, 이메일, 동의 기록(AI 처리 동의 포함), 휴면 상태."}
    - {name: ChildProfile, type: entity, description: "닉네임, PIN(잠금 상태), 목표 기관·급수·시험일, 사용 시간 제한 설정."}
    - {name: StudyPlan, type: entity, description: "시험일까지 날짜별 새 한자 배정(3~15자/일), 부모 수정값."}
    - {name: ReviewItem, type: entity, description: "복습 대상 한자의 간격 단계(1·3·7·14일), 연속 정답 수, 익힘 완료 여부."}
    - {name: TracingProgress, type: entity, description: "한자별 따라쓰기 통과 일자 기록과 쓰기 완료 여부."}
    - {name: ChatThread, type: entity, description: "자녀별 대화 스레드(thread_id, 제목, 생성·최종 시각). 프로필당 최대 100개. 체크포인트는 PostgresSaver."}
    - {name: SafetyEvent, type: entity, description: "유해·개인정보 입력 차단 기록(원문 미저장), 학부모 알림 여부, 대화별 누적 횟수."}
    - {name: UsageLimitConfig, type: value, description: "기능별 한도(챗봇 일 20, 모의고사 주 1 기본)와 변경 적용 시점(인상 즉시, 인하 다음 초기화)."}
    - {name: UsageCounter, type: entity, description: "(자녀 프로필, 기능, 구간 시작) 단위 사용량. 원자적 증가, 실패 응답 제외, 유료→무료 전환 시 초기화."}
    - {name: Subscription, type: entity, description: "부모 계정의 요금제(월·연), 상태(활성·해지 예정·유예·종료), 빌링키, 기간, 결제 확인 시각, 연결 자녀(최대 3)."}
    - {name: PaidUsageEvent, type: entity, description: "구독 중 자녀별 무료 한도 초과 챗봇 질문·모의고사 시작·상세 리포트 열람 기록(환불 판정 근거)."}
    - {name: RefundRequest, type: entity, description: "환불 요청과 상태(자동 승인·자동 거절·검토 요청·운영자 승인·운영자 거절), 거절 사유."}
    - {name: LLMProvider, type: interface, description: "교체 가능한 LLM 어댑터. 기본 ChatBedrockConverse."}

evaluation_principles:
  - {name: data_fidelity, description: "모든 한자 정보는 검수된 DB에서 나오고 AI 출력이 DB와 어긋나지 않는다.", weight: 0.25}
  - {name: child_safety, description: "아동 개인정보 최소 수집, 대화는 학습 주제 안, 아이에게 구독 권유 없음, 안전·감독 기능은 무료.", weight: 0.25}
  - {name: exam_alignment, description: "기관별 급수·출제 형식·기관별 훈·음을 정확히 반영한다.", weight: 0.2}
  - {name: billing_correctness, description: "자녀별 한도, KST 경계, 구독 전환, 환불 판정이 명세대로 재현 가능하다.", weight: 0.15}
  - {name: operability, description: "배포 가능, LLM 교체 가능, 한도·가격·허용치를 설정으로 조정 가능.", weight: 0.15}

exit_conditions:
  - {name: all_acceptance_criteria_pass, description: "AC1~AC17이 모두 자동 검증 또는 기록된 검수로 통과", criteria: "evaluation verdict = pass for every AC"}
  - {name: blocked_by_external_input, description: "기관 공개 배정한자 목록 또는 본인인증 테스트 계정이 없어 진행 불가(한국 기준 획순 참조 데이터와 토스페이먼츠 결제 검증은 검증 제외 대상이라 해당 없음)", criteria: "필수 외부 입력이 없고 안전하게 추정할 수 없음"}
  - {name: spec_conflict, description: "구현 중 사용자 확정 제약 둘이 동시에 만족될 수 없음이 드러남", criteria: "새 사용자 결정 필요"}

