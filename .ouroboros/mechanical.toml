# Stage 1 mechanical checks for the Ouroboros evaluator.
#
# The evaluator (ouroboros/evaluation/languages.py::_parse_command) refuses any command containing shell
# operators (&&, ||, |, ;, >, <, `, $() and runs the rest with create_subprocess_exec. The previous value
# "npm --prefix frontend run test && python -m pytest ..." was therefore dropped (test_command=None), which is
# why the test check showed as "skipped / not configured" while build ran. Bare "python -m pytest" is also
# refused because pytest is not declared by a repo manifest. The chaining now lives inside the npm script
# frontend/package.json "test:all" (vitest, then backend pytest); both must pass for exit code 0.

build = "npm --prefix frontend run build"
test = "npm --prefix frontend run test:all"
timeout = 900
