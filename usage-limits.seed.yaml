goal: Build the free-plan usage-limit system for the elementary-school Hanja exam-prep
  and literacy chatbot PWA (한국어문회 levels 8–4, 대한검정회 levels 8–3). The system counts
  usage per child profile for the chatbot (daily limit) and mock exams (weekly limit).
  It reads limit values from configuration, locks only the feature that is over its
  limit until the next reset, and sends subscription prompts to parents only. It handles
  changes between subscription states and records the usage that decides 7-day refund
  eligibility.
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- Free and paid plans differ by usage. A subscription means unlimited use plus detailed
  reports.
- Limit values must be changeable through configuration without any code change.
- Usage is counted separately for each child profile, never added up across the guardian
  account.
- Daily limits reset at midnight KST.
- Weekly limits reset at Monday 00:00 KST.
- Failed chatbot responses do not count toward usage.
- Chatbot questions have a daily limit. The beta default is 20 per day.
- Mock exams have a weekly limit. The beta default is 1 per week.
- A mock exam is deducted once, when it starts. Resuming the same exam does not deduct
  again.
- Leaving the app keeps the same mock exam resumable, and the exam is submitted automatically
  when time runs out.
- When a limit is reached, only that feature is locked until its next reset. All other
  features stay usable.
- The child's screen shows only a friendly 'see you again' notice (내일 또 만나요). Subscription
  prompts go only to the parent screen and parent push notifications.
- 'These stay unlimited on the free plan: 오늘의 한자 (today''s Hanja), review, tracing
  practice (따라쓰기), the basic report (study time, today''s Hanja completion rate, review
  accuracy), and the safety features (conversation viewing, usage time limits, harmful-input
  alerts).'
- 'Only subscribers get the detailed report: weak Hanja, mock exam score trend, pass
  likelihood, number of Hanja completed in writing practice, and the weekly push summary.'
- Safety and parental-supervision features are never put behind payment.
- After Toss Payments confirms a payment, the limit lock is lifted within 1 minute.
- When a subscription ends and the plan switches from paid to free, the current day's
  and week's usage counters reset to 0.
- If an operator raises a limit, it applies immediately. If an operator lowers a limit,
  it applies from the next reset (midnight KST for daily, Monday 00:00 KST for weekly).
- A refund is in full if paid features were not used within 7 days of payment.
- 'For the refund check, paid-feature use means any of: a chatbot question beyond
  the 20th in a day (over the free limit), a mock exam start beyond the first in the
  same week (over the free limit), or viewing the detailed report.'
- If any one child linked to the subscription used a paid feature, the subscription
  counts as used.
- During a subscription, usage is still counted per child profile, and use beyond
  the free limits is recorded as evidence for the refund check.
