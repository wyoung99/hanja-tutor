assumptions:
- The tech stack, configuration file format and location, and test layout follow the
  existing Seed draft hanja-tutor.seed.yaml and the PRD .ouroboros/pm.md. This interview
  did not specify them.
- The exact wording of the child-facing notice is not fixed. 내일 또 만나요 shows its tone.
  A weekly mock exam lock may use wording that fits the weekly reset.
- The refund check thresholds (21st chatbot question, 2nd mock exam start) follow
  the configured free-limit values in effect, not hardcoded numbers.
- '''Within 1 minute'' is measured from the moment the backend receives Toss Payments''
  payment confirmation.'
- When a limit is lowered and takes effect at the next reset, usage already made that
  day or week is not taken back and causes no retroactive lock.
ontology_schema:
  name: FreePlanUsageLimits
  description: The domain model for usage limits on a children's Hanja learning PWA.
    It covers usage counted per child profile for limited features, reset windows
    in KST, plan state on the guardian account, limit configuration, and the paid-usage
    records that decide refund eligibility.
  fields:
  - name: child_profile_id
    type: string
    description: The child (learner) profile that usage is counted against
    required: true
  - name: guardian_account_id
    type: string
    description: The parent account that owns the subscription and receives subscription
      prompts
    required: true
  - name: plan_state
    type: string
    description: Either free or subscribed. Changing from subscribed to free resets
      the counters.
    required: true
  - name: limited_feature
    type: string
    description: Either chatbot_question (daily limit) or mock_exam_start (weekly
      limit)
    required: true
  - name: limit_config
    type: object
    description: Limit values that can be changed in configuration (chatbot daily
      default 20, mock exam weekly default 1), with the time each change takes effect
    required: true
  - name: usage_counter
    type: number
    description: Usage of a feature for one profile in the current window. Failed
      chatbot responses are not counted.
    required: true
  - name: window_start
    type: string
    description: 'Start of the current window: midnight KST for daily, Monday 00:00
      KST for weekly'
    required: true
  - name: locked_features
    type: array
    description: The features over their limit and locked until the next reset
    required: true
  - name: mock_exam_session
    type: object
    description: 'An exam in progress: deducted at start, can be resumed, submitted
      automatically on timeout'
    required: true
  - name: payment_confirmed_at
    type: string
    description: The time Toss Payments confirmed the payment. The lock must be lifted
      within 1 minute of it.
    required: true
  - name: paid_usage_events
    type: array
    description: Records of each over-limit chatbot question, over-limit mock exam
      start, and detailed report view, per child, used to decide refund eligibility
    required: true
  - name: refund_eligible
    type: boolean
    description: True if no linked child used a paid feature within 7 days of payment
    required: true
evaluation_principles:
- name: Child-safe monetization
  description: Children never see subscription prompts. Safety and supervision features
    are never put behind payment.
  weight: 0.9
- name: Limit correctness
  description: Per-profile counts, KST reset boundaries, deduction at exam start,
    and excluding failed responses all behave exactly as specified.
  weight: 0.9
- name: Configurability
  description: Every limit value can be changed in configuration without code changes,
    with raises applied immediately and lowers applied at the next reset.
  weight: 0.8
- name: Plan transition integrity
  description: Unlocking within 1 minute after payment and resetting counters on paid-to-free
    transitions both work reliably.
  weight: 0.8
- name: Refund auditability
  description: Paid usage is recorded per child, so the 7-day refund decision is reproducible
    and correct.
  weight: 0.7
- name: Scoped locking
  description: A lock affects only the feature over its limit. All other learning
    features stay available.
  weight: 0.7
exit_conditions:
- name: All criteria met
  description: Every acceptance criterion for the usage-limit system is shown to be
    satisfied.
  criteria: All acceptance criteria pass verification or evaluation.
- name: Blocked by external dependency
  description: The work cannot continue without Toss Payments integration details
    or the stack decisions from the existing Seed draft.
  criteria: A required external input is missing and cannot be inferred safely.
- name: Spec conflict
  description: The implementation exposes a contradiction between user-stated constraints
    that needs a new user decision.
  criteria: Two constraints cannot both be satisfied.
